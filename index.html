<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Strike Market - Marketplace Catalog</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="./style.css" rel="stylesheet"/>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div class="themes-overlay" id="themesOverlay"></div>

    <header>
        <h1 id="logo">STRIKE MARKET</h1>
        <div class="logo-load-indicator" id="logoLoadIndicator">LOADING ITEMS 0%</div>
        
        <div class="search-container">
            <div class="input-group">
                <div class="search-wrapper">
                    <button aria-label="Send request" id="requestButton" type="button"><i class="fas fa-paper-plane"></i></button>
                    <input autocomplete="off" id="searchInput" placeholder="Search item, creator, UUID..." type="text"/>
                    <button aria-label="Search" id="searchBtn" type="button"><i class="fas fa-search"></i></button>
                </div>
            </div>
        </div>

        <div class="category-container">
            <div class="category-buttons">
                <button class="active" data-filter="all"><i class="fas fa-infinity" title="All"></i></button>
                <button data-filter="worlds"><i class="fas fa-globe" title="Worlds"></i></button>
                <button data-filter="addons"><i class="fas fa-puzzle-piece" title="Addons"></i></button>
                <button data-filter="textures"><i class="fas fa-image" title="Textures"></i></button>
                <button data-filter="skins"><i class="fas fa-tshirt" title="Skins"></i></button>
            </div>
            <div class="category-count" id="categoryCount">0 ALL</div>
        </div>
    </header>

    <!-- Main Grid for 37,000+ Items -->
    <main class="grid-container" id="itemContainer"></main>

    <!-- MCF2P Original Detail Modal -->
    <div class="overlay" id="downloadOverlay">
        <div class="download-modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Item Title</h3>
                <div class="modal-actions">
                    <button class="close-btn" id="closeModal"><i class="fas fa-times"></i></button>
                </div>
            </div>
            
            <div class="slider-container" id="modalSliderContainer">
                <div class="slider-track" id="sliderTrack"></div>
            </div>

            <div class="slider-thumbs" id="sliderThumbs"></div>

            <div class="modal-meta-row">
                <p class="modal-type" id="modalType">Type</p>
                <div class="modal-rating" id="modalRating">
                    <i class="fas fa-star"></i>
                    <span id="modalRatingValue">4.8</span>
                    <span id="modalTotalRatings"></span>
                </div>
            </div>

            <div class="modal-description" id="modalDescription">
                <div id="modalDescriptionContent">Loading description...</div>
            </div>

            <div class="download-links" id="downloadLinks">
                <button class="request-action-btn" id="modalRequestBtn">
                    <i class="fas fa-paper-plane"></i> Request Download Link
                </button>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
