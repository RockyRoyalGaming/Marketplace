<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strike Admin Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; padding: 15px; max-width: 550px; margin: 0 auto; }
        .box { background: #1e293b; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 25px; }
        input, select, textarea { display: block; width: 90%; margin-bottom: 12px; padding: 12px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; font-size: 14px; }
        textarea { height: 80px; resize: vertical; }
        button { background: #0ea5e9; color: white; padding: 13px; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; font-size: 15px; }
        .secret-zone { border-bottom: 2px dashed #334155; padding-bottom: 10px; margin-bottom: 15px; }
        
        .item-row { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #334155; }
        .item-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .item-info img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; }
        .item-text { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .actions { display: flex; gap: 6px; }
        .btn-edit { background: #f59e0b; padding: 6px 10px; font-size: 12px; border-radius: 5px; width: auto; }
        .btn-del { background: #ef4444; padding: 6px 10px; font-size: 12px; border-radius: 5px; width: auto; }
        .btn-done { background: #10b981; padding: 6px 10px; font-size: 12px; border-radius: 5px; width: auto; }
        .field-label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 5px; margin-top: 5px; }
        
        .req-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; }
        .req-tag.pending { background: rgba(251, 192, 45, 0.2); color: #fbc02d; }
        .req-tag.completed { background: rgba(16, 185, 129, 0.2); color: #10b981; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- 1. UPLOAD & EDIT FORM -->
    <div class="box">
        <h2 id="formHeading" style="text-align: center; color: #38bdf8;">🤫 Strike Admin Upload</h2>
        
        <div class="secret-zone">
            <input type="password" id="ghToken" placeholder="🔑 GitHub PAT">
            <input type="password" id="webhookUrl" placeholder="🤖 Discord Webhook URL (Optional)">
        </div>

        <input type="hidden" id="editKey" value="">

        <input type="text" id="addonTitle" placeholder="Item Name (e.g. 200 Mobs)">
        
        <select id="addonCategory">
            <option value="addon">Add-On</option>
            <option value="world">World</option>
            <option value="texture">Texture</option>
            <option value="skin">Skin</option>
            <option value="mashup">Mashup</option>
        </select>

        <textarea id="addonDesc" placeholder="Item Description..."></textarea>
        
        <input type="text" id="addonLink" placeholder="Download Link (Mediafire, Gofile...)">
        
        <label class="field-label">Carousel Images (Screenshots):</label>
        <input type="file" id="imageFiles" multiple accept="image/*">

        <label class="field-label">Panorama 360 Image (Optional):</label>
        <input type="file" id="panoramaFile" accept="image/*">

        <button onclick="startUpload()" id="uploadBtn">🚀 UPLOAD TO SITE</button>
        <p id="status" style="font-size: 13px; text-align: center; margin-top: 15px; font-weight: bold;"></p>
    </div>

    <!-- 2. MANAGE REQUESTS SECTION -->
    <div class="box">
        <h3 style="color: #fbc02d; margin-bottom: 15px;">📋 User Requests Management</h3>
        <div id="requestsManageList">Loading requests...</div>
    </div>

    <!-- 3. MANAGE ITEMS SECTION -->
    <div class="box">
        <h3 style="color: #38bdf8; margin-bottom: 15px;">📦 Manage Existing Items</h3>
        <div id="itemsManageList">Loading items...</div>
    </div>

    <script>
        var firebaseConfig = {
          apiKey: "AIzaSyDOnkkfPgIX9rlEXefUKnZ3atV6zdBu1RU",
          authDomain: "strikemarket-32a5e.firebaseapp.com",
          databaseURL: "https://strikemarket-32a5e-default-rtdb.firebaseio.com",
          projectId: "strikemarket-32a5e",
          storageBucket: "strikemarket-32a5e.firebasestorage.app",
          messagingSenderId: "719596182121",
          appId: "1:719596182121:web:d02dfdd3089f560fc560f8",
          measurementId: "G-KTVM3J2491"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        var database = firebase.database();

        window.onload = function() {
            document.getElementById('ghToken').value = localStorage.getItem('myGhToken') || "";
            loadItemsForManagement();
            loadRequestsForManagement();
        };

        // --- REQUESTS MANAGEMENT LOGIC ---
        function loadRequestsForManagement() {
            var reqListDiv = document.getElementById('requestsManageList');
            database.ref('requests').on('value', (snapshot) => {
                reqListDiv.innerHTML = "";
                if (!snapshot.exists()) {
                    reqListDiv.innerHTML = "<p style='color:#666; font-size:13px;'>No requests found.</p>";
                    return;
                }

                snapshot.forEach((child) => {
                    var key = child.key;
                    var req = child.val();
                    var isCompleted = req.status === "completed";

                    var row = document.createElement('div');
                    row.className = "item-row";
                    row.innerHTML = `
                        <div class="item-text" style="max-width: 280px;">
                            <strong>${req.addon}</strong>
                            ${req.link ? `<a href="${req.link}" target="_blank" style="color:#38bdf8; font-size:11px; margin-left:5px;">[Link]</a>` : ""}
                            <br>
                            <span style="color:#aaa; font-size:11px;">By: ${req.user}</span> | 
                            <span class="req-tag ${req.status}">${req.status.toUpperCase()}</span>
                        </div>
                        <div class="actions">
                            ${!isCompleted ? `<button class="btn-done" title="Mark Complete" onclick="completeRequest('${key}')">✅</button>` : ""}
                            <button class="btn-del" title="Delete Request" onclick="deleteRequest('${key}')">🗑️</button>
                        </div>
                    `;
                    reqListDiv.prepend(row);
                });
            });
        }

        function completeRequest(key) {
            var downloadLink = prompt("Enter Download Link for this Addon:");
            if (!downloadLink) return;

            database.ref('requests/' + key).update({
                status: "completed",
                downloadLink: downloadLink
            }).then(() => alert("Request marked as completed!"))
              .catch(err => alert("Error: " + err.message));
        }

        function deleteRequest(key) {
            if (confirm("Delete this request?")) {
                database.ref('requests/' + key).remove()
                    .then(() => alert("Request deleted!"))
                    .catch(err => alert("Error: " + err.message));
            }
        }

        // --- ITEMS LOAD KARNA (MANAGE LIST) ---
        function loadItemsForManagement() {
            var listDiv = document.getElementById('itemsManageList');
            database.ref('market_items').on('value', (snapshot) => {
                listDiv.innerHTML = "";
                if (!snapshot.exists()) {
                    listDiv.innerHTML = "<p style='color:#666; font-size:13px;'>No items found.</p>";
                    return;
                }

                snapshot.forEach((child) => {
                    var key = child.key;
                    var item = child.val();
                    var thumb = (item.images && item.images[0]) ? item.images[0] : (item.image || "https://via.placeholder.com/45");

                    var row = document.createElement('div');
                    row.className = "item-row";
                    row.innerHTML = `
                        <div class="item-info">
                            <img src="${thumb}" onerror="this.src='https://via.placeholder.com/45'">
                            <div class="item-text">
                                <strong>${item.title}</strong><br>
                                <span style="color:#10b981; font-size:11px;">${item.category.toUpperCase()}</span>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn-edit" onclick="setupEdit('${key}')">✏️</button>
                            <button class="btn-del" onclick="deleteItem('${key}')">🗑️</button>
                        </div>
                    `;
                    listDiv.prepend(row);
                });
            });
        }

        function deleteItem(key) {
            if (confirm("Delete this item permanently?")) {
                database.ref('market_items/' + key).remove()
                    .then(() => alert("Item deleted!"))
                    .catch((err) => alert("Error: " + err.message));
            }
        }

        function setupEdit(key) {
            database.ref('market_items/' + key).once('value', (snapshot) => {
                var item = snapshot.val();
                if (!item) return;

                document.getElementById('editKey').value = key;
                document.getElementById('addonTitle').value = item.title;
                document.getElementById('addonCategory').value = item.category;
                document.getElementById('addonDesc').value = item.description || "";
                document.getElementById('addonLink').value = (item.links && item.links[0]) ? item.links[0].url : "";

                document.getElementById('formHeading').innerText = "✏️ Editing: " + item.title;
                document.getElementById('uploadBtn').innerText = "💾 UPDATE ITEM";
                document.getElementById('uploadBtn').style.background = "#f59e0b";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        async function uploadFileToGithub(file, filePath, ghToken) {
            let base64Data = await new Promise((resolve) => {
                let reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(file);
            });

            let ghResponse = await fetch("https://api.github.com/repos/RockyRoyalGaming/images/contents/" + filePath, {
                method: 'PUT',
                headers: { 'Authorization': 'token ' + ghToken, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "Upload " + filePath, content: base64Data })
            });

            if (!ghResponse.ok) {
                let errData = await ghResponse.json();
                throw new Error("GitHub Error: " + errData.message);
            }
            return "https://raw.githubusercontent.com/RockyRoyalGaming/images/main/" + filePath;
        }

        async function startUpload() {
            var btn = document.getElementById('uploadBtn');
            var ghToken = document.getElementById('ghToken').value;
            var webhookUrl = document.getElementById('webhookUrl').value;
            var editKey = document.getElementById('editKey').value;

            var addonTitle = document.getElementById('addonTitle').value;
            var addonCategory = document.getElementById('addonCategory').value;
            var addonDesc = document.getElementById('addonDesc').value;
            var addonLink = document.getElementById('addonLink').value;
            var imageFiles = document.getElementById('imageFiles').files;
            var panoramaFiles = document.getElementById('panoramaFile').files;
            var statusEl = document.getElementById('status');

            if (!addonTitle || !addonLink) {
                alert("Please fill Title and Download Link!");
                return;
            }

            if (ghToken) localStorage.setItem('myGhToken', ghToken);

            btn.disabled = true;

            try {
                var folderName = addonTitle.replace(/[^a-zA-Z0-9]/g, "_");
                var uploadedUrls = [];
                var uploadedPanoramaUrl = "";

                if (imageFiles.length > 0) {
                    statusEl.innerText = "⏳ Carousel Photos GitHub par upload ho rahi hain...";
                    statusEl.style.color = "#38bdf8";

                    for (let i = 0; i < imageFiles.length; i++) {
                        let path = folderName + "/" + (i + 1) + ".png";
                        let url = await uploadFileToGithub(imageFiles[i], path, ghToken);
                        uploadedUrls.push(url);
                    }
                }

                if (panoramaFiles.length > 0) {
                    statusEl.innerText = "⏳ Panorama Image upload ho rahi hai...";
                    statusEl.style.color = "#38bdf8";

                    let path = folderName + "/0panorama.png";
                    uploadedPanoramaUrl = await uploadFileToGithub(panoramaFiles[0], path, ghToken);
                }

                statusEl.innerText = "⏳ Firebase update ho raha hai...";

                var itemData = {
                    title: addonTitle,
                    category: addonCategory,
                    description: addonDesc,
                    links: [{ type: "Download", url: addonLink, icon: "fa-download" }]
                };

                if (uploadedUrls.length > 0) {
                    itemData.images = uploadedUrls;
                }
                if (uploadedPanoramaUrl !== "") {
                    itemData.panorama = uploadedPanoramaUrl;
                }

                if (editKey) {
                    await database.ref('market_items/' + editKey).update(itemData);
                    statusEl.innerText = "✅ Item Updated Successfully!";
                } else {
                    itemData.id = Date.now().toString();
                    if (uploadedUrls.length === 0) {
                        throw new Error("Pehli baar upload ke liye photo select karein!");
                    }
                    await database.ref('market_items').push().set(itemData);
                    statusEl.innerText = "✅ Item Added Successfully!";
                }

                statusEl.style.color = "#10b981";

                document.getElementById('editKey').value = "";
                document.getElementById('addonTitle').value = "";
                document.getElementById('addonDesc').value = "";
                document.getElementById('addonLink').value = "";
                document.getElementById('imageFiles').value = "";
                document.getElementById('panoramaFile').value = "";
                document.getElementById('formHeading').innerText = "🤫 Strike Admin Upload";
                btn.innerText = "🚀 UPLOAD TO SITE";
                btn.style.background = "#0ea5e9";

            } catch (err) {
                console.error(err);
                statusEl.innerText = "❌ " + err.message;
                statusEl.style.color = "#ef4444";
            }

            btn.disabled = false;
        }
    </script>
</body>
</html>
