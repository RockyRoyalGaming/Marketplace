<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strike Admin Manager (Auto-Fetcher)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; padding: 15px; max-width: 550px; margin: 0 auto; }
        
        .admin-nav { display: flex; gap: 8px; margin-bottom: 20px; background: #1e293b; padding: 6px; border-radius: 12px; }
        .nav-btn { flex: 1; background: transparent; color: #94a3b8; border: none; padding: 10px 5px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .nav-btn.active { background: #0ea5e9; color: white; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .box { background: #1e293b; padding: 18px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 20px; }
        input, select, textarea { display: block; width: 100%; box-sizing: border-box; margin-bottom: 12px; padding: 11px; background: #0f172a; color: white; border: 1px solid #334155; border-radius: 8px; font-size: 14px; }
        textarea { height: 75px; resize: vertical; }
        .btn-main { background: #0ea5e9; color: white; padding: 12px; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; font-size: 15px; }
        
        /* Auto Fetcher Bar */
        .fetcher-box { background: #0b1329; border: 1px solid #38bdf8; border-radius: 10px; padding: 12px; margin-bottom: 15px; }
        .fetcher-input-group { display: flex; gap: 8px; }
        .fetcher-input-group input { margin-bottom: 0; }
        .btn-fetch { background: #38bdf8; color: #090e17; font-weight: bold; border: none; border-radius: 8px; padding: 0 15px; cursor: pointer; }

        .preview-thumbs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 5px; }
        .preview-thumbs img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #334155; }

        .search-bar { background: #090e17; border: 1px solid #38bdf8; margin-bottom: 15px; padding-left: 12px; }
        .secret-zone { border-bottom: 2px dashed #334155; padding-bottom: 10px; margin-bottom: 15px; }

        /* File Blocks */
        .file-card { background: #090e17; border: 1px solid #293548; border-radius: 10px; padding: 10px; margin-bottom: 12px; }
        .file-card-header { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
        .file-card-header select { width: 45%; margin-bottom: 0; }
        .file-card-header input { width: 55%; margin-bottom: 0; }
        .mirror-container { margin-left: 10px; border-left: 2px solid #334155; padding-left: 8px; margin-top: 6px; }
        .mirror-row { display: flex; gap: 6px; margin-bottom: 6px; }
        .mirror-row input { margin-bottom: 0; }
        .btn-mini { background: #334155; color: #94a3b8; border: none; padding: 5px 8px; border-radius: 5px; font-size: 11px; cursor: pointer; }
        .btn-del-file { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 5px 8px; border-radius: 5px; font-size: 11px; cursor: pointer; margin-left: auto; }
        .btn-add-block { background: #1e293b; border: 1px dashed #38bdf8; color: #38bdf8; padding: 9px; border-radius: 8px; width: 100%; margin-bottom: 14px; cursor: pointer; }

        /* List Items */
        .item-row { display: flex; align-items: center; justify-content: space-between; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #334155; }
        .item-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
        .item-info img { width: 42px; height: 42px; border-radius: 6px; object-fit: cover; }
        .item-text { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
        .actions { display: flex; gap: 6px; }
        .btn-action { border: none; cursor: pointer; padding: 6px 10px; font-size: 12px; border-radius: 5px; }
        .btn-edit { background: #f59e0b; color: white; }
        .btn-del { background: #ef4444; color: white; }
        .btn-fulfill { background: #10b981; color: white; }

        .section-subhead { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin: 12px 0 6px 0; color: #94a3b8; font-weight: bold; }
        .field-label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="admin-nav">
        <button class="nav-btn active" onclick="switchTab('tabUpload')">🚀 Upload</button>
        <button class="nav-btn" onclick="switchTab('tabRequests')">📋 Requests (<span id="reqCount">0</span>)</button>
        <button class="nav-btn" onclick="switchTab('tabItems')">📦 Items (<span id="itemsCount">0</span>)</button>
    </div>

    <!-- TAB 1: UPLOAD & EDIT -->
    <div id="tabUpload" class="tab-content active">
        <div class="box">
            <h2 id="formHeading" style="text-align: center; color: #38bdf8; margin-top:0;">🤫 Strike Admin Upload</h2>
            
            <!-- AUTO FETCHER BOX -->
            <div class="fetcher-box">
                <span class="field-label" style="color:#38bdf8;">✨ Auto-Fill from Minecraft Marketplace:</span>
                <div class="fetcher-input-group">
                    <input type="text" id="marketplaceInput" placeholder="Paste Market Link or UUID" style="margin-bottom:0;">
                    <button type="button" class="btn-fetch" onclick="fetchMarketDetails()">Fetch</button>
                </div>
                <div id="fetchStatus" style="font-size:11px; margin-top:5px; color:#94a3b8;"></div>
            </div>

            <div class="secret-zone">
                <input type="password" id="ghToken" placeholder="🔑 GitHub PAT (Only if uploading manual images)">
                <input type="password" id="linkpaysToken" placeholder="🔗 Linkpays API Token">
                <input type="password" id="webhookUrl" placeholder="🤖 Discord Webhook URL (Optional)">
            </div>

            <input type="hidden" id="editKey" value="">
            <input type="hidden" id="fulfillReqKey" value="">

            <input type="text" id="addonTitle" placeholder="Item Name (e.g. 200 Mobs)">
            
            <div style="display:flex; gap:8px;">
                <input type="text" id="addonCreator" placeholder="Creator (e.g. Noxcrew)" style="width:50%;">
                <input type="text" id="addonRating" placeholder="Rating (e.g. 4.7)" style="width:25%;">
                <input type="text" id="addonSize" placeholder="Size (e.g. 15MB)" style="width:25%;">
            </div>

            <select id="addonCategory">
                <option value="addon">Add-On</option>
                <option value="world">World</option>
                <option value="texture">Texture</option>
                <option value="skin">Skin</option>
                <option value="mashup">Mashup</option>
            </select>

            <textarea id="addonDesc" placeholder="Item Description..."></textarea>

            <!-- Auto-Fetched Images Preview -->
            <div id="fetchedImagesPreview" class="preview-thumbs" style="display:none;"></div>

            <label class="field-label">File Blocks & Mirrors (Auto-Shortened via Linkpays):</label>
            <div id="fileBlocksWrapper"></div>
            <button type="button" class="btn-add-block" onclick="addFileBlock()">+ Add Another File Block</button>

            <label class="field-label">Manual Images (Optional if fetched from Market):</label>
            <input type="file" id="imageFiles" multiple accept="image/*">

            <button onclick="startUpload()" id="uploadBtn" class="btn-main">🚀 UPLOAD TO SITE</button>
            <p id="status" style="font-size: 13px; text-align: center; margin-top: 15px; font-weight: bold;"></p>
        </div>
    </div>

    <!-- TAB 2: REQUESTS -->
    <div id="tabRequests" class="tab-content">
        <div class="box">
            <h3 style="color: #fbc02d; margin-top:0;">📋 Manage Requests</h3>
            <input type="text" id="searchRequests" class="search-bar" placeholder="🔍 Search requests..." onkeyup="filterRequestsList()">
            
            <div class="section-subhead" style="color:#fbc02d;">⏳ Pending Requests</div>
            <div id="pendingReqList">Loading...</div>

            <div class="section-subhead" style="color:#10b981; margin-top:20px;">✅ Completed Requests</div>
            <div id="completedReqList">Loading...</div>
        </div>
    </div>

    <!-- TAB 3: MANAGE ITEMS -->
    <div id="tabItems" class="tab-content">
        <div class="box">
            <h3 style="color: #38bdf8; margin-top:0;">📦 Manage Live Items</h3>
            <input type="text" id="searchItems" class="search-bar" placeholder="🔍 Search items by title..." onkeyup="filterItemsList()">
            <div id="itemsManageList">Loading...</div>
        </div>
    </div>

    <script>
        var firebaseConfig = {
          apiKey: "AIzaSyDOnkkfPgIX9rlEXefUKnZ3atV6zdBu1RU",
          authDomain: "strikemarket-32a5e.firebaseapp.com",
          databaseURL: "https://strikemarket-32a5e-default-rtdb.firebaseio.com",
          projectId: "strikemarket-32a5e",
          storageBucket: "strikemarket-32a5e.firebasestorage.app",
          messagingSenderId: "719596182121",
          appId: "1:719596182121:web:d02df0d3089f560fc560f8",
          measurementId: "G-KTVM3J2491"
        };
        
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        var database = firebase.database();

        let allRequestsData = [];
        let allItemsData = [];
        let autoFetchedImages = [];

        window.onload = function() {
            document.getElementById('ghToken').value = localStorage.getItem('myGhToken') || "";
            document.getElementById('linkpaysToken').value = localStorage.getItem('myLpToken') || "";
            addFileBlock("Addon", "Main Addon");
            bindData();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            if (event && event.target && event.target.classList) {
                event.target.classList.add('active');
            }
        }

        // --- MULTI-PROXY AUTO FETCHER ENGINE ---
        async function fetchMarketDetails() {
            let input = document.getElementById('marketplaceInput').value.trim();
            let status = document.getElementById('fetchStatus');
            if (!input) {
                alert("Please enter a Minecraft Market URL or UUID!");
                return;
            }

            // 1. Extract UUID correctly
            let uuid = "";
            let match = input.match(/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/);
            if (match) {
                uuid = match[0];
            } else if (input.includes("id=")) {
                uuid = input.split("id=")[1].split("&")[0];
            } else {
                uuid = input;
            }

            status.innerText = `⏳ UUID: ${uuid} fetch ho raha hai...`;
            status.style.color = "#38bdf8";

            let targetUrl = `https://catalog.minecraftservices.com/v1.0/items/details?itemIds=${uuid}`;
            
            // Multiple CORS proxies fallback
            let proxies = [
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
                `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(targetUrl)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
            ];

            let itm = null;

            for (let proxy of proxies) {
                try {
                    let res = await fetch(proxy);
                    if (!res.ok) continue;
                    let data = await res.json();
                    
                    let itemsArray = data.items || data;
                    if (Array.isArray(itemsArray) && itemsArray.length > 0) {
                        itm = itemsArray[0];
                        break;
                    }
                } catch (e) {
                    console.warn("Proxy attempt failed:", e);
                }
            }

            if (!itm) {
                status.innerText = "❌ Auto-fetch failed: Minecraft server blocked proxy. Title manually fill karein.";
                status.style.color = "#ef4444";
                return;
            }

            try {
                // Auto Fill Details
                document.getElementById('addonTitle').value = itm.title || itm.name || "";
                document.getElementById('addonCreator').value = itm.creatorName || (itm.creator ? itm.creator.name : "") || "";
                document.getElementById('addonRating').value = itm.averageRating ? itm.averageRating.toFixed(1) : (itm.rating || "4.5");
                document.getElementById('addonDesc').value = itm.description || itm.summary || "";

                // Auto Category
                let cat = (itm.primaryCategory || itm.category || "").toLowerCase();
                if (cat.includes("addon")) document.getElementById('addonCategory').value = "addon";
                else if (cat.includes("world")) document.getElementById('addonCategory').value = "world";
                else if (cat.includes("skin")) document.getElementById('addonCategory').value = "skin";
                else if (cat.includes("texture")) document.getElementById('addonCategory').value = "texture";
                else if (cat.includes("mashup")) document.getElementById('addonCategory').value = "mashup";

                // Auto HD Images
                autoFetchedImages = [];
                if (itm.images && Array.isArray(itm.images)) {
                    itm.images.forEach(img => {
                        let u = img.url || img;
                        if (typeof u === "string") autoFetchedImages.push(u);
                    });
                }

                // Preview Render
                let prevBox = document.getElementById('fetchedImagesPreview');
                prevBox.innerHTML = "";
                if (autoFetchedImages.length > 0) {
                    prevBox.style.display = "flex";
                    autoFetchedImages.forEach(u => {
                        let im = document.createElement('img');
                        im.src = u;
                        im.onerror = () => im.remove();
                        prevBox.appendChild(im);
                    });
                }

                status.innerText = `✅ Loaded: ${itm.title || "Item"} (${autoFetchedImages.length} HD photos ready)`;
                status.style.color = "#10b981";

            } catch (parseErr) {
                console.error(parseErr);
                status.innerText = "❌ Parsing failed: " + parseErr.message;
                status.style.color = "#ef4444";
            }
        }

        // --- REALTIME DATA LISTENERS ---
        function bindData() {
            database.ref('requests').on('value', snap => {
                allRequestsData = [];
                if (snap.exists()) {
                    snap.forEach(child => {
                        allRequestsData.push({ key: child.key, ...child.val() });
                    });
                }
                document.getElementById('reqCount').innerText = allRequestsData.filter(r => r.status === 'pending').length;
                renderRequests(allRequestsData);
            });

            database.ref('market_items').on('value', snap => {
                allItemsData = [];
                if (snap.exists()) {
                    snap.forEach(child => {
                        allItemsData.push({ key: child.key, ...child.val() });
                    });
                }
                document.getElementById('itemsCount').innerText = allItemsData.length;
                renderItems(allItemsData);
            });
        }

        function filterRequestsList() {
            let q = document.getElementById('searchRequests').value.toLowerCase();
            let filtered = allRequestsData.filter(r => 
                (r.addon && r.addon.toLowerCase().includes(q)) || 
                (r.user && r.user.toLowerCase().includes(q))
            );
            renderRequests(filtered);
        }

        function renderRequests(list) {
            let pDiv = document.getElementById('pendingReqList');
            let cDiv = document.getElementById('completedReqList');
            pDiv.innerHTML = "";
            cDiv.innerHTML = "";

            let pending = list.filter(r => r.status === 'pending');
            let completed = list.filter(r => r.status === 'completed');

            if (pending.length === 0) pDiv.innerHTML = "<p style='color:#666; font-size:12px;'>No pending requests.</p>";
            if (completed.length === 0) cDiv.innerHTML = "<p style='color:#666; font-size:12px;'>No completed requests.</p>";

            pending.reverse().forEach(r => pDiv.appendChild(createRequestRow(r, false)));
            completed.reverse().forEach(r => cDiv.appendChild(createRequestRow(r, true)));
        }

        function createRequestRow(r, isCompleted) {
            let row = document.createElement('div');
            row.className = "item-row";
            row.innerHTML = `
                <div class="item-text">
                    <strong>${r.addon}</strong>
                    ${r.link ? `<a href="${r.link}" target="_blank" style="color:#38bdf8; font-size:11px; margin-left:4px;">[Link]</a>` : ""}
                    <br><span style="color:#888; font-size:11px;">By: ${r.user}</span>
                </div>
                <div class="actions">
                    ${!isCompleted ? `<button class="btn-action btn-fulfill" title="Fulfill" onclick="fulfillRequest('${r.key}', '${encodeURIComponent(r.addon)}', '${encodeURIComponent(r.user)}', '${encodeURIComponent(r.link || '')}')">🚀</button>` : ""}
                    <button class="btn-action btn-del" title="Delete" onclick="deleteRequest('${r.key}')">🗑️</button>
                </div>
            `;
            return row;
        }

        function filterItemsList() {
            let q = document.getElementById('searchItems').value.toLowerCase();
            let filtered = allItemsData.filter(i => (i.title && i.title.toLowerCase().includes(q)));
            renderItems(filtered);
        }

        function renderItems(list) {
            let div = document.getElementById('itemsManageList');
            div.innerHTML = "";
            if (list.length === 0) {
                div.innerHTML = "<p style='color:#666; font-size:12px;'>No items found.</p>";
                return;
            }

            [...list].reverse().forEach(item => {
                let thumb = (item.images && item.images[0]) ? item.images[0] : (item.image || "https://via.placeholder.com/45");
                let row = document.createElement('div');
                row.className = "item-row";
                row.innerHTML = `
                    <div class="item-info">
                        <img src="${thumb}" onerror="this.src='https://via.placeholder.com/45'">
                        <div class="item-text">
                            <strong>${item.title}</strong><br>
                            <span style="color:#10b981; font-size:11px;">${(item.category || '').toUpperCase()}</span>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn-action btn-edit" onclick="setupEdit('${item.key}')">✏️</button>
                        <button class="btn-action btn-del" onclick="deleteItem('${item.key}')">🗑️</button>
                    </div>
                `;
                div.appendChild(row);
            });
        }

        function fulfillRequest(key, encTitle, encUser, encLink) {
            document.getElementById('fulfillReqKey').value = key;
            document.getElementById('editKey').value = "";
            let marketLink = decodeURIComponent(encLink);
            
            document.getElementById('addonTitle').value = decodeURIComponent(encTitle);
            document.getElementById('addonDesc').value = `(Suggested by ${decodeURIComponent(encUser)})\n\n`;
            
            if (marketLink) {
                document.getElementById('marketplaceInput').value = marketLink;
                fetchMarketDetails();
            }

            document.getElementById('formHeading').innerText = `🚀 Fulfilling: ${decodeURIComponent(encTitle)}`;
            document.getElementById('uploadBtn').innerText = "🚀 UPLOAD & COMPLETE";
            document.getElementById('uploadBtn').style.background = "#10b981";

            switchTab('tabUpload');
            document.querySelectorAll('.nav-btn')[0].classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteRequest(key) {
            if (confirm("Delete this request?")) database.ref('requests/' + key).remove();
        }

        function deleteItem(key) {
            if (confirm("Delete this item permanently?")) database.ref('market_items/' + key).remove();
        }

        function setupEdit(key) {
            database.ref('market_items/' + key).once('value', (snapshot) => {
                var item = snapshot.val();
                if (!item) return;

                document.getElementById('editKey').value = key;
                document.getElementById('fulfillReqKey').value = "";
                document.getElementById('addonTitle').value = item.title;
                document.getElementById('addonCreator').value = item.creator || "";
                document.getElementById('addonRating').value = item.rating || "";
                document.getElementById('addonSize').value = item.fileSize || "";
                document.getElementById('addonCategory').value = item.category;
                document.getElementById('addonDesc').value = item.description || "";

                var wrapper = document.getElementById('fileBlocksWrapper');
                wrapper.innerHTML = "";
                
                if (item.fileBlocks && item.fileBlocks.length > 0) {
                    item.fileBlocks.forEach(b => {
                        let mUrls = (b.mirrors || []).map(m => m.url);
                        addFileBlock(b.type, b.title, b.mainLink ? b.mainLink.url : "", mUrls);
                    });
                } else if (item.links && item.links.length > 0) {
                    item.links.forEach(l => addFileBlock("Addon", l.type, l.url));
                } else {
                    addFileBlock();
                }

                document.getElementById('formHeading').innerText = "✏️ Editing: " + item.title;
                document.getElementById('uploadBtn').innerText = "💾 UPDATE ITEM";
                document.getElementById('uploadBtn').style.background = "#f59e0b";
                
                switchTab('tabUpload');
                document.querySelectorAll('.nav-btn')[0].classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        let blockCounter = 0;
        function addFileBlock(type = "Addon", customTitle = "", mainUrl = "", mirrors = []) {
            blockCounter++;
            let bId = "block_" + blockCounter;
            let wrapper = document.getElementById('fileBlocksWrapper');

            let card = document.createElement('div');
            card.className = "file-card";
            card.id = bId;
            card.innerHTML = `
                <div class="file-card-header">
                    <select class="block-type">
                        <option value="Addon" ${type === 'Addon' ? 'selected' : ''}>Add-On</option>
                        <option value="World" ${type === 'World' ? 'selected' : ''}>World</option>
                        <option value="Skin Pack" ${type === 'Skin Pack' ? 'selected' : ''}>Skin Pack</option>
                        <option value="Texture" ${type === 'Texture' ? 'selected' : ''}>Texture</option>
                    </select>
                    <input type="text" class="block-title" placeholder="Block Title (e.g. World 1, Behavior)" value="${customTitle}">
                    <button type="button" class="btn-del-file" onclick="document.getElementById('${bId}').remove()">✖</button>
                </div>
                <input type="text" class="block-main-url" placeholder="Main Download Link (Mediafire/etc)" value="${mainUrl}">
                
                <div class="mirror-container" id="mirrors_${bId}"></div>
                <button type="button" class="btn-mini" onclick="addMirrorField('${bId}')">+ Add Mirror Link</button>
            `;
            wrapper.appendChild(card);

            if (mirrors && mirrors.length > 0) {
                mirrors.forEach(m => addMirrorField(bId, m));
            }
        }

        function addMirrorField(blockId, url = "") {
            let container = document.getElementById('mirrors_' + blockId);
            let row = document.createElement('div');
            row.className = "mirror-row";
            row.innerHTML = `
                <input type="text" class="block-mirror-url" placeholder="Mirror Link (Gofile, Mega, Drive...)" value="${url}">
                <button type="button" class="btn-mini" style="color:#ef4444" onclick="this.parentElement.remove()">✖</button>
            `;
            container.appendChild(row);
        }

        function detectHostName(url) {
            if (!url) return "Server";
            let u = url.toLowerCase();
            if (u.includes("mediafire")) return "Mediafire";
            if (u.includes("gofile")) return "Gofile";
            if (u.includes("mega.nz") || u.includes("mega.io")) return "Mega";
            if (u.includes("drive.google")) return "G-Drive";
            if (u.includes("devuploads")) return "DevUploads";
            if (u.includes("terabox") || u.includes("1024tera") || u.includes("terashare")) return "Terabox";
            if (u.includes("dropbox")) return "Dropbox";
            if (u.includes("github")) return "GitHub";
            return "Mirror";
        }

        async function shortenUrlWithLinkpays(rawUrl, apiToken) {
            if (!apiToken || rawUrl.includes("linkpays.in")) return rawUrl;
            try {
                let apiUrl = `https://linkpays.in/api?api=${apiToken}&url=${encodeURIComponent(rawUrl)}`;
                let res = await fetch(apiUrl);
                let data = await res.json();
                if (data.status === "success" && data.shortenedUrl) return data.shortenedUrl;
            } catch (e) {
                console.warn("Linkpays Error:", e);
            }
            return rawUrl;
        }

        async function uploadFileToGithub(file, filePath, ghToken) {
            let base64Data = await new Promise((resolve) => {
                let reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(file);
            });

            let ghResponse = await fetch("https://api.github.com/repos/RockyRoyalGaming/images/contents/" + filePath, {
                method: 'PUT',
                headers: { 'Authorization': 'token ' + ghToken, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "Upload " + filePath, content: base64Data })
            });

            if (!ghResponse.ok) {
                let errData = await ghResponse.json();
                throw new Error("GitHub Error: " + errData.message);
            }
            return "https://raw.githubusercontent.com/RockyRoyalGaming/images/main/" + filePath;
        }

        function buildDiscordPayload(item, requestedUser, firstImageUrl, fileSize) {
            let downloadLinksText = "";
            if (item.fileBlocks && item.fileBlocks.length > 0) {
                item.fileBlocks.forEach(b => {
                    let hostStr = b.mainLink.host ? ` (${b.mainLink.host})` : "";
                    downloadLinksText += `🔹 **${b.title}**: ${b.mainLink.url}${hostStr}\n`;
                    if (b.mirrors && b.mirrors.length > 0) {
                        b.mirrors.forEach(m => {
                            downloadLinksText += `   └ *Mirror (${m.host})*: ${m.url}\n`;
                        });
                    }
                });
            } else if (item.links && item.links.length > 0) {
                item.links.forEach(l => {
                    downloadLinksText += `🔹 **${l.type}**: ${l.url}\n`;
                });
            }

            let reqBy = requestedUser ? requestedUser : "Community";
            let sizeStr = fileSize ? fileSize.trim() : "Unavailable";

            let messageContent = 
`# 《 ${item.title} 》

\`Up By RockyRG\`

> 📁 **Category** : ${item.category.toUpperCase()}
> 👤 **Creator** : ${item.creator || "Minecraft"}
> ⭐ **Rating** : ${item.rating || "4.5"}
> ⚙️ **File Size** : ${sizeStr}
> 🍀 **Support Version** : Bedrock 1.21+ (Original/Patch)
> 🙋‍♂️ **Requested by** : ${reqBy}
> ⚠️ **Advise** : Enable all Experimental Toggles

📥 **Download Links:**
${downloadLinksText}
---
💌 **Support / Request Multiple Content with Direct Link**
💳 **UPI:** \`thestrike@ybl\` (₹10 = 5 DLCs)

💬 **Join Chat / WhatsApp Group:**
https://chat.whatsapp.com/JdeFaKUFV9E3rtpYgk6XdP

@everyone`;

            return {
                thread_name: item.title,
                content: messageContent,
                embeds: firstImageUrl ? [
                    {
                        title: `🖼️ Preview: ${item.title}`,
                        color: 39129,
                        image: { url: firstImageUrl }
                    }
                ] : []
            };
        }

        async function startUpload() {
            var btn = document.getElementById('uploadBtn');
            var ghToken = document.getElementById('ghToken').value;
            var linkpaysToken = document.getElementById('linkpaysToken').value;
            var webhookUrl = document.getElementById('webhookUrl').value;
            var editKey = document.getElementById('editKey').value;
            var fulfillReqKey = document.getElementById('fulfillReqKey').value;

            var addonTitle = document.getElementById('addonTitle').value;
            var addonCreator = document.getElementById('addonCreator').value;
            var addonRating = document.getElementById('addonRating').value;
            var addonSize = document.getElementById('addonSize').value;
            var addonCategory = document.getElementById('addonCategory').value;
            var addonDesc = document.getElementById('addonDesc').value;
            var imageFiles = document.getElementById('imageFiles').files;
            var statusEl = document.getElementById('status');

            var blockCards = document.querySelectorAll('.file-card');
            var rawBlocks = [];

            blockCards.forEach(card => {
                let type = card.querySelector('.block-type').value;
                let title = card.querySelector('.block-title').value.trim() || type;
                let mainUrl = card.querySelector('.block-main-url').value.trim();
                let mirrorInputs = card.querySelectorAll('.block-mirror-url');
                let mirrors = [];
                mirrorInputs.forEach(inp => {
                    if (inp.value.trim()) mirrors.push(inp.value.trim());
                });

                if (mainUrl) rawBlocks.push({ type, title, mainUrl, mirrors });
            });

            if (!addonTitle || rawBlocks.length === 0) {
                alert("Please fill Item Name and at least 1 Main Download Link!");
                return;
            }

            if (ghToken) localStorage.setItem('myGhToken', ghToken);
            if (linkpaysToken) localStorage.setItem('myLpToken', linkpaysToken);

            btn.disabled = true;

            try {
                statusEl.innerText = "⏳ 1/3: Shortening Links (Linkpays)...";
                statusEl.style.color = "#38bdf8";

                var processedFileBlocks = [];
                var legacyLinks = [];
                var iconMap = { "Addon": "fa-puzzle-piece", "World": "fa-globe", "Skin Pack": "fa-tshirt", "Texture": "fa-image" };

                for (let b of rawBlocks) {
                    let mainShort = await shortenUrlWithLinkpays(b.mainUrl, linkpaysToken);
                    let mainHost = detectHostName(b.mainUrl);

                    let processedMirrors = [];
                    for (let mUrl of b.mirrors) {
                        let mShort = await shortenUrlWithLinkpays(mUrl, linkpaysToken);
                        processedMirrors.push({
                            url: mShort,
                            host: detectHostName(mUrl)
                        });
                    }

                    processedFileBlocks.push({
                        type: b.type,
                        title: b.title,
                        icon: iconMap[b.type] || "fa-download",
                        mainLink: { url: mainShort, host: mainHost },
                        mirrors: processedMirrors
                    });

                    legacyLinks.push({
                        type: b.title + (mainHost ? ` (${mainHost})` : ""),
                        url: mainShort,
                        icon: iconMap[b.type] || "fa-download"
                    });
                }

                var finalImages = [...autoFetchedImages];

                if (imageFiles.length > 0) {
                    statusEl.innerText = "⏳ 2/3: Uploading Manual Images to GitHub...";
                    var folderName = addonTitle.replace(/[^a-zA-Z0-9]/g, "_");
                    for (let i = 0; i < imageFiles.length; i++) {
                        let path = folderName + "/" + (i + 1) + ".png";
                        let url = await uploadFileToGithub(imageFiles[i], path, ghToken);
                        finalImages.push(url);
                    }
                }

                if (finalImages.length === 0) {
                    throw new Error("No images available! Please Auto-Fetch or select manual photos.");
                }

                statusEl.innerText = "⏳ 3/3: Updating Database...";

                var itemData = {
                    title: addonTitle,
                    creator: addonCreator,
                    rating: addonRating,
                    fileSize: addonSize,
                    category: addonCategory,
                    description: addonDesc,
                    images: finalImages,
                    fileBlocks: processedFileBlocks,
                    links: legacyLinks
                };

                if (editKey) {
                    await database.ref('market_items/' + editKey).update(itemData);
                    statusEl.innerText = "✅ Item Updated Successfully!";
                } else {
                    itemData.id = Date.now().toString();
                    await database.ref('market_items').push().set(itemData);

                    if (fulfillReqKey) {
                        await database.ref('requests/' + fulfillReqKey).update({
                            status: "completed",
                            downloadLink: legacyLinks[0].url
                        });
                    }
                    statusEl.innerText = "✅ Live & Request Completed!";
                }

                if (webhookUrl) {
                    try {
                        let reqUser = "";
                        let match = addonDesc.match(/\(Suggested by (.*?)\)/i);
                        if (match) reqUser = match[1];

                        let payload = buildDiscordPayload(itemData, reqUser, finalImages[0] || "", addonSize);
                        let postUrl = webhookUrl.includes("?") ? webhookUrl + "&wait=true" : webhookUrl + "?wait=true";

                        await fetch(postUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                    } catch (dcErr) {
                        console.warn("Discord Webhook Error:", dcErr);
                    }
                }

                statusEl.style.color = "#10b981";

                // Reset
                document.getElementById('editKey').value = "";
                document.getElementById('fulfillReqKey').value = "";
                document.getElementById('addonTitle').value = "";
                document.getElementById('addonCreator').value = "";
                document.getElementById('addonRating').value = "";
                document.getElementById('addonSize').value = "";
                document.getElementById('addonDesc').value = "";
                document.getElementById('marketplaceInput').value = "";
                document.getElementById('fetchedImagesPreview').style.display = "none";
                autoFetchedImages = [];
                document.getElementById('imageFiles').value = "";
                document.getElementById('fileBlocksWrapper').innerHTML = "";
                addFileBlock("Addon", "Main Addon");
                document.getElementById('formHeading').innerText = "🤫 Strike Admin Upload";
                btn.innerText = "🚀 UPLOAD TO SITE";
                btn.style.background = "#0ea5e9";

            } catch (err) {
                console.error(err);
                statusEl.innerText = "❌ " + err.message;
                statusEl.style.color = "#ef4444";
            }

            btn.disabled = false;
        }
    </script>
